url: https://loukesio.github.io/ggsynteny/

template:
  bootstrap: 5

reference:
  - title: Plot
    desc: Macro- and micro-synteny visualisation.
    contents:
      - plot_synteny
      - plot_microsynteny
  - title: Circular plots
    desc: Genomic-coordinate chord views built with ggplot2 layers.
    contents:
      - plot_circular_synteny
      - plot_circular_microsynteny
  - title: Reference comparison
    desc: Compare supplied variants and alignment identity on a shared reference.
    contents:
      - plot_reference_comparison
      - save_reference_comparison
  - title: Interactive
    desc: ggiraph rendering with hover highlights and tooltips.
    contents:
      - syn_girafe
      - ggsynteny_app
  - title: Colours
    desc: The 32 built-in ltc palettes.
    contents:
      - syn_palettes
  - title: Data input
    desc: Parsers for common synteny file formats.
    contents:
      - read_synteny_tsv
      - read_mcscanx
      - read_genespace
  - title: Example data
    contents:
      - rice_sorghum
      - example_synteny_data
      - demo_microsynteny_data

articles:
  - title: Guides
    contents:
      - "getting-started"
      - "articles/real-data"
      - "articles/interactive"
      - "articles/circular-synteny"
